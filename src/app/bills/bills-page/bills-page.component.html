<div class="bills-page">
  <h1 class="visually-hidden">{{ 'bills.title' | transloco }}</h1>

  @if (hasError) {
    <p class="error-message" role="alert">{{ 'bills.loadError' | transloco }}</p>
  }

  @if (paymentError) {
    <p class="error-message payment-error" role="alert">
      {{ paymentError.key | transloco: { name: paymentError.name } }}
    </p>
  }

  @if (isLoading) {
    <p class="loading" role="status">{{ 'bills.loading' | transloco }}</p>
  } @else {
    <app-month-strip
      [year]="year"
      [months]="months"
      [selectedMonth]="selectedMonth"
      [today]="today"
      [preferences]="preferences"
      (monthSelected)="selectMonth($event)"
    ></app-month-strip>

    <div class="columns">
      <div class="main">
        <app-month-detail
          [year]="year"
          [month]="selectedMonth"
          [bills]="selectedBills"
          [recurringBills]="recurringBills"
          [today]="today"
          [preferences]="preferences"
          (previous)="previousMonth()"
          (next)="nextMonth()"
          (pay)="payBill($event)"
          (undoPayment)="undoPayment($event)"
          (addBill)="openAddForm()"
          (billRemoved)="reload()"
        ></app-month-detail>

        @if (form) {
          <app-add-bill-form
            [year]="year"
            [month]="selectedMonth"
            [recurringBill]="form.recurringBill"
            [preferences]="preferences"
            (saved)="onFormSaved()"
            (cancelled)="closeForm()"
          ></app-add-bill-form>
        }
      </div>

      <aside class="side">
        <app-recurring-bills-panel
          [recurringBills]="recurringBills"
          [preferences]="preferences"
          [months]="months"
          [today]="today"
          (edit)="openEditForm($event)"
          (removed)="onRecurringBillRemoved($event)"
        ></app-recurring-bills-panel>
        <app-preferences-menu></app-preferences-menu>
        <app-status-legend></app-status-legend>
      </aside>
    </div>
  }
</div>
