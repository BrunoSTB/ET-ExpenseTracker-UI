@if (errorMessage) {
  <p class="error-message">{{ errorMessage }}</p>
}

@if (!isLoading && !errorMessage) {
  <div class="card-list">
    @for (month of monthList; track month) {
      <div>
        <app-expenses-card
          [currentDate]="month"
          [monthExpenses]="getExpensesForMonth(month.getMonth())"
        ></app-expenses-card>
      </div>
    }
  </div>
}
